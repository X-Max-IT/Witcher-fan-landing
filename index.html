<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="ico" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Witcher 3: Wild Hunt</title>
</head>

<body>
  <header class="header">
    <div class="container header__inner">
      <a href="#" class="header__logo">
        <img class="header__logo-image" alt="The Witcher 3: Wild Hunt" data-js="logo" id="js-logo" width="200">
      </a>
      <nav class="header__menu" id="mobile-menu" data-js="mobile-menu">
        <ul class="header__list">
          <li class="header__list-item" data-js="menu-list-item">
            <a href="#about" class="header__link">About</a>
          </li>
          <li class="header__list-item">
            <a href="#character" class="header__link" data-js="menu-list-item">Characters</a>
          </li>
          <li class="header__list-item">
            <a href="#system" class="header__link" data-js="menu-list-item">System</a>
          </li>
        </ul>
      </nav>
      <div class="header__actions">
        <div class="header__socials">
          <a href="#" class="header__social-link">
            <img alt="Twitter" class="header__social-icon" data-js="twitter">
          </a>
          <a href="#" class="header__social-link">
            <img alt="Youtube" class="header__social-icon" data-js="youtube">
          </a>
          <a href="#" class="header__social-link">
            <img alt="Facebook" class="header__social-icon" data-js="facebook">
          </a>
        </div>
        <button type="button" class="button header__button button--transparent button--accent" data-js="preorder">Pre-order now</button>
      </div>


      <button type="button" class="button-burger" data-js="burger-button" aria-label="Toggle menu" aria-expanded="false"
        aria-controls="mobile-menu">
        <span class="button-burger__line"></span>
        <span class="button-burger__line"></span>
        <span class="button-burger__line"></span>
      </button>
  </header>


  <!--Модуль Vite-->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
